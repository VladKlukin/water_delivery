services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: water_db
      POSTGRES_USER: water_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажи POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water_user -d water_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://water_user:${POSTGRES_PASSWORD}@db:5432/water_db
      TZ: ${DELIVERY_TIMEZONE:-Asia/Yekaterinburg}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
